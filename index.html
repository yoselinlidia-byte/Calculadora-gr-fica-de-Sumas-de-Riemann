<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo Integral - Sumas de Riemann</title>
    <!-- Chart.js para la gráfica interactiva -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Math.js para evaluar funciones de forma segura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- Fuentes estilo escrito a mano y limpias -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-grid: #f3d6dc;
            --main-title: #7a1c31;
            --card-bg: #fff5f7;
            --border-sketch: #7a1c31;
            --text-color: #4a2e35;
            --accent-pink: #e2879c;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fae1e6;
            /* Fondo cuadriculado estilo libreta */
            background-image: 
                linear-gradient(to right, rgba(222, 160, 172, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(222, 160, 172, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        header {
            text-align: center;
            position: relative;
            margin-top: 10px;
        }

        h1 {
            color: var(--main-title);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Efecto de nota adhesiva con cinta en el subtítulo */
        .tape-banner {
            display: inline-block;
            background: #ffffff;
            border: 2px solid var(--border-sketch);
            padding: 8px 20px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
            box-shadow: 3px 3px 0px rgba(122, 28, 49, 0.2);
            position: relative;
            transform: rotate(-1deg);
            margin-top: 5px;
        }

        .tape-banner::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 16px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 1px dashed #b5838d;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Tarjetas estilo libreta con borde dibujado */
        .sketch-card {
            background-color: var(--card-bg);
            border: 2.5px solid var(--border-sketch);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; /* Bordes irregulares orgánicos estilo libreta */
            padding: 25px;
            box-shadow: 4px 4px 0px rgba(122, 28, 49, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--main-title);
        }

        input, select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid var(--border-sketch);
            background-color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            color: var(--text-color);
            outline: none;
        }

        input[type="range"] {
            accent-color: var(--main-title);
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #ffffff;
            border: 2px solid var(--border-sketch);
            border-radius: 12px;
            padding: 5px;
        }

        /* Sección de Resultados Estilo Cuadros Separados */
        .results-container {
            background-color: var(--card-bg);
            border: 2.5px solid var(--border-sketch);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: 20px 25px;
            box-shadow: 4px 4px 0px rgba(122, 28, 49, 0.15);
        }

        .results-title {
            color: var(--main-title);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
            margin-top: 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .result-box {
            background: #ffffff;
            border: 2px solid var(--border-sketch);
            border-radius: 15px;
            text-align: center;
            overflow: hidden;
            box-shadow: 2px 2px 0px rgba(122, 28, 49, 0.1);
        }

        .result-box-header {
            background-color: #f7cad0;
            color: var(--main-title);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 8px;
            border-bottom: 2px solid var(--border-sketch);
        }

        .result-box-body {
            padding: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cálculo Integral</h1>
            <div class="tape-banner">
                Calculadora gráfica interactiva de Sumas de Riemann
            </div>
        </header>

        <div class="main-grid">
            <!-- Panel de Controles (Estilo Libreta) -->
            <div class="sketch-card">
                <div class="control-group">
                    <label for="functionInput">Función f(x)</label>
                    <input type="text" id="functionInput" value="x^2">
                </div>

                <div class="control-group">
                    <label for="aInput">Extremo inferior (a)</label>
                    <input type="number" id="aInput" value="1" step="0.1">
                </div>

                <div class="control-group">
                    <label for="bInput">Extremo superior (b)</label>
                    <input type="number" id="bInput" value="2" step="0.1">
                </div>

                <div class="control-group">
                    <label for="methodSelect">Método de aproximación</label>
                    <select id="methodSelect">
                        <option value="right">Extremo Derecho</option>
                        <option value="left">Extremo Izquierdo</option>
                        <option value="midpoint">Punto Medio</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="nSlider">Número de particiones (n): <span id="nValue">10</span></label>
                    <input type="range" id="nSlider" min="2" max="100" value="10">
                </div>
            </div>

            <!-- Panel de Gráfica (Estilo Apunte) -->
            <div class="sketch-card" style="align-items: center; justify-content: center;">
                <div class="chart-container">
                    <canvas id="riemannChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Sección de Resumen de Cálculos (Cuadros separados estilo imagen) -->
        <div class="results-container">
            <h3 class="results-title">Resumen de Cálculos</h3>
            <div class="results-grid">
                <div class="result-box">
                    <div class="result-box-header">Método</div>
                    <div class="result-box-body" id="resMethod">Extremo Derecho</div>
                </div>
                <div class="result-box">
                    <div class="result-box-header">Ancho (Δx)</div>
                    <div class="result-box-body" id="resDelta">-</div>
                </div>
                <div class="result-box">
                    <div class="result-box-header">Área Aproximada</div>
                    <div class="result-box-body" id="resApprox" style="color: var(--main-title);">-</div>
                </div>
                <div class="result-box">
                    <div class="result-box-header">Área Exacta (Ref)</div>
                    <div class="result-box-body" id="resExact">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        function calculateRiemann() {
            try {
                const expr = document.getElementById('functionInput').value;
                const a = parseFloat(document.getElementById('aInput').value);
                const b = parseFloat(document.getElementById('bInput').value);
                const n = parseInt(document.getElementById('nSlider').value);
                const method = document.getElementById('methodSelect').value;

                document.getElementById('nValue').innerText = n;

                const compiledFn = math.compile(expr);
                const f = (x) => {
                    try { return compiledFn.evaluate({ x: x }); } catch (e) { return 0; }
                };

                const dx = (b - a) / n;
                let approxArea = 0;
                let labels = [];
                let curveData = [];

                const steps = 150;
                const stepSize = (b - a) / steps;
                for (let i = 0; i <= steps; i++) {
                    let xVal = a + i * stepSize;
                    labels.push(xVal.toFixed(2));
                    curveData.push(f(xVal));
                }

                for (let i = 0; i < n; i++) {
                    let x0 = a + i * dx;
                    let x1 = a + (i + 1) * dx;
                    let sampleX = method === 'left' ? x0 : (method === 'right' ? x1 : (x0 + x1) / 2);
                    let height = f(sampleX);
                    approxArea += height * dx;
                }

                let barData = new Array(labels.length).fill(null);
                for (let i = 0; i < n; i++) {
                    let x0 = a + i * dx;
                    let x1 = a + (i + 1) * dx;
                    let sampleX = method === 'left' ? x0 : (method === 'right' ? x1 : (x0 + x1) / 2);
                    let height = f(sampleX);

                    let index = Math.round(((sampleX - a) / (b - a)) * steps);
                    if (index >= 0 && index < barData.length) {
                        barData[index] = height;
                    }
                }

                document.getElementById('resMethod').innerText = method === 'left' ? 'Extremo Izq.' : (method === 'right' ? 'Extremo Der.' : 'Punto Medio');
                document.getElementById('resDelta').innerText = dx.toFixed(4);
                document.getElementById('resApprox').innerText = approxArea.toFixed(4);
                document.getElementById('resExact').innerText = "Integración";

                updateChart(labels, curveData, barData);

            } catch (error) {
                console.error("Error al calcular:", error);
            }
        }

        function updateChart(labels, curveData, barData) {
            const ctx = document.getElementById('riemannChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'f(x)',
                            data: curveData,
                            borderColor: '#7a1c31',
                            borderWidth: 3,
                            pointRadius: 0,
                            tension: 0.1,
                            fill: false
                        },
                        {
                            label: 'Rectángulos',
                            data: barData,
                            type: 'bar',
                            backgroundColor: 'rgba(226, 135, 156, 0.55)',
                            borderColor: '#7a1c31',
                            borderWidth: 1,
                            barPercentage: 1.0,
                            categoryPercentage: 1.0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: 'rgba(122, 28, 49, 0.1)' },
                            ticks: { font: { family: 'Quicksand' }, color: '#4a2e35' }
                        },
                        y: {
                            grid: { color: 'rgba(122, 28, 49, 0.1)' },
                            ticks: { font: { family: 'Quicksand' }, color: '#4a2e35' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { font: { family: 'Quicksand', weight: 'bold' }, color: '#4a2e35' }
                        }
                    }
                }
            });
        }

        document.getElementById('functionInput').addEventListener('input', calculateRiemann);
        document.getElementById('aInput').addEventListener('input', calculateRiemann);
        document.getElementById('bInput').addEventListener('input', calculateRiemann);
        document.getElementById('nSlider').addEventListener('input', calculateRiemann);
        document.getElementById('methodSelect').addEventListener('change', calculateRiemann);

        window.onload = calculateRiemann;
    </script>
</body>
</html>
