<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cálculo Integral – Sumas de Riemann</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Patrick+Hand&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
<style>
  :root {
    --rosa: #f48fb1;
    --rosa-claro: #fde4ec;
    --papel: #fff5f8;
    --vino: #7a0f3a;
    --azul: rgba(100, 181, 246, .45);
    --azul-borde: #4a90c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    font-family: "Nunito", sans-serif; color: #222;
    background:
      linear-gradient(90deg, transparent 46px, #f3a0b8 47px, transparent 48px),
      repeating-linear-gradient(transparent 0 27px, #f7c1d1 27px 28px),
      var(--papel);
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 {
    font-family: "Baloo 2", sans-serif; font-weight: 800;
    color: var(--vino); text-align: center; margin: 8px 0 12px;
    font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: .5px;
  }
  .nota {
    display: block; width: fit-content; margin: 0 auto 28px;
    padding: 8px 26px; background: #fff; border: 1px solid #ddd;
    font-family: "Patrick Hand", cursive; font-size: 1.4rem; text-align: center;
    transform: rotate(-1deg); box-shadow: 2px 3px 0 rgba(122,15,58,.12);
  }
  .panel {
    background: var(--rosa-claro); border: 2px solid var(--vino);
    border-radius: 14px; padding: 18px;
  }
  .fila { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  label { display: block; font-weight: 700; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 9px 10px; font: inherit;
    border: 1px solid var(--vino); border-radius: 8px; background: #fff;
  }
  input[type=range] { width: 100%; accent-color: var(--rosa); }
  input:focus-visible, select:focus-visible { outline: 3px solid var(--vino); outline-offset: 1px; }
  .grafica { background: #fff; padding: 10px; }
  canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; display: block; }
  .error { color: #b00020; font-weight: 700; min-height: 1.3em; margin: 8px 0 0; }
  .resumen { margin-top: 20px; }
  .resumen h2 { margin: 0 0 12px; color: var(--vino); font-size: 1.2rem; }
  .celdas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .celda { background: var(--rosa); border: 1px solid var(--vino); border-radius: 8px; overflow: hidden; text-align: center; }
  .celda b { display: block; padding: 8px 4px; background: #f6a8c2; font-size: .95rem; }
  .celda span { display: block; padding: 10px 4px; background: var(--rosa-claro); font-size: 1.05rem; }
  @media (max-width: 760px) {
    .fila { grid-template-columns: 1fr; }
    .celdas { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<main>
  <h1>CÁLCULO INTEGRAL</h1>
  <p class="nota">Calculadora gráfica interactiva de Sumas de Riemann</p>

  <div class="fila">
    <section class="panel" aria-label="Parámetros">
      <label for="fx">Función f(x)</label>
      <input type="text" id="fx" value="x^2" autocomplete="off" spellcheck="false">

      <label for="a">Extremo inferior (a)</label>
      <input type="number" id="a" value="1" step="any">

      <label for="b">Extremo superior (b)</label>
      <input type="number" id="b" value="2" step="any">

      <label for="metodo">Método de aproximación</label>
      <select id="metodo">
        <option value="derecho" selected>Extremo Derecho</option>
        <option value="izquierdo">Extremo Izquierdo</option>
        <option value="medio">Punto Medio</option>
        <option value="trapecio">Trapecio</option>
      </select>

      <label for="n">Número de particiones (n): <span id="nValor">20</span></label>
      <input type="range" id="n" min="1" max="100" value="20">

      <p class="error" id="error" role="alert"></p>
    </section>

    <section class="panel grafica" aria-label="Gráfica">
      <canvas id="lienzo" width="800" height="600"></canvas>
    </section>
  </div>

  <section class="panel resumen" aria-label="Resumen de cálculos">
    <h2>Resumen de Cálculos</h2>
    <div class="celdas">
      <div class="celda"><b>Método</b><span id="rMetodo">–</span></div>
      <div class="celda"><b>Ancho (Δx)</b><span id="rAncho">–</span></div>
      <div class="celda"><b>Área Aproximada</b><span id="rAprox">–</span></div>
      <div class="celda"><b>Área Exacta (Ref)</b><span id="rExacta">–</span></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const cv = $("lienzo"), ctx = cv.getContext("2d");
const NOMBRES = { derecho: "Extremo Derecho", izquierdo: "Extremo Izquierdo", medio: "Punto Medio", trapecio: "Trapecio" };

function compilar(texto) {
  const nodo = math.compile(texto.replace(/,/g, "."));
  const f = x => { const y = nodo.evaluate({ x }); return typeof y === "number" ? y : NaN; };
  f(1); // prueba para detectar errores de sintaxis
  return f;
}

// Referencia: regla de Simpson con muchos subintervalos
function integralExacta(f, a, b) {
  const N = 2000, h = (b - a) / N;
  let s = f(a) + f(b);
  for (let i = 1; i < N; i++) s += f(a + i * h) * (i % 2 ? 4 : 2);
  return s * h / 3;
}

function dibujar() {
  const err = $("error"); err.textContent = "";
  const a = parseFloat($("a").value), b = parseFloat($("b").value);
  const n = +$("n").value, metodo = $("metodo").value;
  $("nValor").textContent = n;

  let f;
  try { f = compilar($("fx").value); }
  catch (e) { err.textContent = "Función no válida. Ejemplo: sin(x) + x^2"; return; }
  if (!isFinite(a) || !isFinite(b) || a >= b) { err.textContent = "Se necesita a < b."; return; }

  const dx = (b - a) / n;
  let suma = 0;
  const bloques = [];
  for (let i = 0; i < n; i++) {
    const x0 = a + i * dx, x1 = x0 + dx;
    let alto, y0 = f(x0), y1 = f(x1);
    if (metodo === "izquierdo") alto = y0;
    else if (metodo === "derecho") alto = y1;
    else if (metodo === "medio") alto = f(x0 + dx / 2);
    else alto = (y0 + y1) / 2;
    suma += alto * dx;
    bloques.push({ x0, x1, y0, y1, alto });
  }
  const exacta = integralExacta(f, a, b);
  if (![suma, exacta].every(isFinite)) { err.textContent = "La función no está definida en todo [a, b]."; return; }

  $("rMetodo").textContent = NOMBRES[metodo];
  $("rAncho").textContent = dx.toFixed(4);
  $("rAprox").textContent = suma.toFixed(4);
  $("rExacta").textContent = exacta.toFixed(4);

  // Rango vertical
  const puntos = 300, ys = [0];
  for (let i = 0; i <= puntos; i++) ys.push(f(a + (b - a) * i / puntos));
  bloques.forEach(k => ys.push(k.alto));
  const finitos = ys.filter(isFinite);
  let ymin = Math.min(...finitos), ymax = Math.max(...finitos);
  const pad = (ymax - ymin || 1) * 0.08; ymin -= ymin < 0 ? pad : 0; ymax += pad;

  const W = cv.width, H = cv.height, m = { l: 60, r: 20, t: 20, b: 45 };
  const X = x => m.l + (x - a) / (b - a) * (W - m.l - m.r);
  const Y = y => H - m.b - (y - ymin) / (ymax - ymin) * (H - m.t - m.b);

  ctx.clearRect(0, 0, W, H);
  ctx.font = "16px Nunito, sans-serif"; ctx.fillStyle = "#444"; ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1;

  // Cuadrícula y etiquetas
  for (let i = 0; i <= 8; i++) {
    const y = ymin + (ymax - ymin) * i / 8, py = Y(y);
    ctx.beginPath(); ctx.moveTo(m.l, py); ctx.lineTo(W - m.r, py); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(y.toFixed(2), m.l - 8, py + 5);
  }
  for (let i = 0; i <= 8; i++) {
    const x = a + (b - a) * i / 8, px = X(x);
    ctx.beginPath(); ctx.moveTo(px, m.t); ctx.lineTo(px, H - m.b); ctx.stroke();
    ctx.textAlign = "center"; ctx.fillText(x.toFixed(2), px, H - m.b + 22);
  }

  // Rectángulos (o trapecios)
  ctx.fillStyle = "rgba(100,181,246,.45)"; ctx.strokeStyle = "#4a90c9"; ctx.lineWidth = 1;
  const y0 = Y(Math.max(ymin, Math.min(0, ymax)));
  bloques.forEach(k => {
    ctx.beginPath();
    if (metodo === "trapecio") {
      ctx.moveTo(X(k.x0), y0); ctx.lineTo(X(k.x0), Y(k.y0));
      ctx.lineTo(X(k.x1), Y(k.y1)); ctx.lineTo(X(k.x1), y0);
    } else {
      ctx.rect(X(k.x0), Y(k.alto), X(k.x1) - X(k.x0), y0 - Y(k.alto));
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  // Curva f(x)
  ctx.strokeStyle = "#7a0f3a"; ctx.lineWidth = 3; ctx.beginPath();
  for (let i = 0; i <= puntos; i++) {
    const x = a + (b - a) * i / puntos, y = f(x);
    i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y));
  }
  ctx.stroke();
}

["fx", "a", "b", "metodo", "n"].forEach(id => $(id).addEventListener("input", dibujar));
document.fonts.ready.then(dibujar);
dibujar();
</script>
</body>
</html>
